# 观测栈：Grafana + ELK（与 environment 共用 gbm-network）
# 用法：
#   docker compose -f docker-compose-environment.yml -f docker-compose-observability.yml up -d
version: "3.9"

services:
  grafana:
    image: grafana/grafana:10.2.0
    container_name: gbm-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
      TZ: Asia/Shanghai
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gbm-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gbm-network

  elasticsearch:
    image: elasticsearch:7.17.28
    container_name: gbm-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - cluster.name=gbm-es
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - gbm-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - gbm-network

  logstash:
    image: logstash:7.17.28
    container_name: gbm-logstash
    restart: always
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "4560:4560"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - gbm-network

  kibana:
    image: kibana:7.17.28
    container_name: gbm-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN
      TZ: Asia/Shanghai
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - gbm-network

volumes:
  gbm-grafana-data:
  gbm-es-data:
