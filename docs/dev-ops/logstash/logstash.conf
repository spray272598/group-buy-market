input {
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4560
    codec => json_lines
    type => "app"
  }
  # 兼容本地文件采集（可选挂载）
  # file {
  #   path => ["/var/log/group-buy-market/*.log"]
  #   start_position => "beginning"
  #   codec => json
  # }
}

filter {
  if [level] {
    mutate { add_field => { "[@metadata][level]" => "%{level}" } }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "group-buy-market-log-%{+YYYY.MM.dd}"
  }
  # 调试时可打开
  # stdout { codec => rubydebug }
}
